
# Base H2 local guardada en data/starbucks.mv.db.
# Cierra la aplicación antes de abrir la misma base en DBeaver.
db.url=jdbc:h2:file:./data/starbucks;FILE_LOCK=FILE
db.username=sa
db.password=

# Crea las tablas si no existen y carga los datos base sin duplicarlos.
db.ddl.auto=true
db.ddl.script=schema_sv.sql
db.seed.auto=true
db.seed.scripts=crear.sql,sql_merge.sql
